name: Pages

# Builds the coverage site from published OpenSwiftUI releases and deploys it to
# GitHub Pages. An OpenSwiftUI release sends `openswiftui-release`, and the new
# coverage table is then added to that release's notes.
#
# All jobs run on GitHub-hosted runners. Each baseline Xcode compares the
# releases on its own runner, so SDK interfaces are read where they are
# installed and are never stored. Cache entries for each release, target, and
# SDK are stored as OCI artifacts in GHCR and reused while their fingerprint
# matches.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: OpenSwiftUI release whose notes get the coverage table. Leave empty to only deploy the site.
        default: ''
        type: string
  repository_dispatch:
    types: [openswiftui-release]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://openswiftuiproject.github.io/InterfaceCoverage/
  OCI_REPOSITORY: ghcr.io/openswiftuiproject/interface-coverage-cache

jobs:
  tool:
    name: Build the tool
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: .build
          key: tool-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**') }}
          restore-keys: tool-${{ runner.os }}-
      - name: Build
        run: swift build -c release
      # The site command reads its assets from the resource bundle next to the binary.
      - name: Package the tool
        run: tar -czf "$RUNNER_TEMP/tool.tar.gz" -C .build/release interface-coverage InterfaceCoverage_InterfaceCoverage.bundle
      - uses: actions/upload-artifact@v7
        with:
          name: tool
          path: ${{ runner.temp }}/tool.tar.gz
          retention-days: 1

  compare:
    name: Compare with Xcode ${{ matrix.xcode }}
    needs: tool
    strategy:
      fail-fast: false
      matrix:
        include:
          # Xcode 16.4 supplies the iOS 18.5 and macOS 15.5 baselines.
          - runner: macos-15
            xcode: '16.4'
          - runner: macos-26
            xcode: '26.6'
          - runner: xcode-27
            xcode: '27.0'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: tool
          path: ${{ runner.temp }}
      - name: Unpack the tool
        run: |
          mkdir -p "$RUNNER_TEMP/tool"
          tar -xzf "$RUNNER_TEMP/tool.tar.gz" -C "$RUNNER_TEMP/tool"
      - uses: oras-project/setup-oras@v2
      - name: Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Compare releases
        env:
          GH_TOKEN: ${{ github.token }}
          XCODE: /Applications/Xcode_${{ matrix.xcode }}.app
        run: |
          python3 Scripts/collect_openswiftui_releases.py collect --all-releases --xcode "$XCODE" \
            --work "$RUNNER_TEMP/work" --tool "$RUNNER_TEMP/tool/interface-coverage" \
            --oci-repository "$OCI_REPOSITORY" --publish-oci-cache --no-site
      - uses: actions/upload-artifact@v7
        with:
          name: reports-xcode-${{ matrix.xcode }}
          path: |
            ${{ runner.temp }}/work/records.json
            ${{ runner.temp }}/work/reports
          retention-days: 1

  site:
    name: Build the coverage site
    needs: compare
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: tool
          path: ${{ runner.temp }}
      - name: Unpack the tool
        run: |
          mkdir -p "$RUNNER_TEMP/tool"
          tar -xzf "$RUNNER_TEMP/tool.tar.gz" -C "$RUNNER_TEMP/tool"
      - uses: actions/download-artifact@v8
        with:
          pattern: reports-*
          path: ${{ runner.temp }}/reports
      - name: Generate the site
        run: |
          inputs=()
          for directory in "$RUNNER_TEMP"/reports/*/; do inputs+=(--input "$directory"); done
          python3 Scripts/collect_openswiftui_releases.py assemble "${inputs[@]}" \
            --work "$RUNNER_TEMP/work" --site "$RUNNER_TEMP/site" --site-url "$SITE_URL" \
            --tool "$RUNNER_TEMP/tool/interface-coverage"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy to GitHub Pages
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release-notes:
    name: Add coverage to the release notes
    needs: deploy
    if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Update the OpenSwiftUI release notes
        env:
          # A fine-grained token with write access to OpenSwiftUI contents.
          GH_TOKEN: ${{ secrets.OPENSWIFTUI_RELEASE_PAT }}
          VERSION: ${{ github.event.client_payload.version || inputs.release }}
        run: |
          python3 Scripts/update_release_notes.py --repository OpenSwiftUIProject/OpenSwiftUI \
            --version "$VERSION" --summary "${SITE_URL}summary/openswiftui/${VERSION}.json" \
            --baseline "iOS 18.5" --baseline "macOS 15.5"
